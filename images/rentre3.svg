<svg width="380" height="260" viewBox="0 0 380 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Illustration éditoriale textuelle sur la crise humanitaire en Haïti</title>
<desc>Visuel composé uniquement de texte, sans personnage, présentant le chiffre 6,4 millions de personnes dépendant d'une aide humanitaire d'urgence en Haïti en 2026.</desc>

<rect x="0" y="0" width="380" height="260" fill="#fdf6e8"/>
<rect x="0" y="0" width="10" height="260" fill="#0e17f5"/>
<rect x="10" y="0" width="10" height="260" fill="#c8412f"/>

<text x="45" y="70" font-size="14" font-weight="500" fill="#a8532f" font-family="Georgia, serif" letter-spacing="1">HAÏTI — RENTRÉE 2026</text>

<text x="45" y="130" font-size="48" font-weight="700" fill="#1c2536" font-family="Georgia, serif">6,4 millions</text>

<text x="45" y="162" font-size="16" font-weight="500" fill="#2f3b52" font-family="Georgia, serif">
<tspan x="45" dy="0">de personnes dépendent</tspan>
<tspan x="45" dy="22">d'une aide humanitaire</tspan>
<tspan x="45" dy="22">d'urgence pour survivre</tspan>
</text>

<line x1="45" y1="235" x2="335" y2="235" stroke="#a8532f" stroke-width="1" opacity="0.4"/>
<text x="45" y="253" font-size="12" font-weight="400" fill="#a8532f" font-family="Georgia, serif">Source : OCHA, Plan de réponse humanitaire 2026</text>

</svg>
