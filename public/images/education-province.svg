<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" role="img" aria-labelledby="edu-prov-title edu-prov-desc">
  <title id="edu-prov-title">L'accès à l'éducation de qualité dans nos villes de province</title>
  <desc id="edu-prov-desc">Illustration aux couleurs bleu profond et blanc d'Educa-Psy montrant des élèves étudiant avec des livres ouverts dans une salle de classe lumineuse ouverte sur une ville de province entourée de collines.</desc>

  <defs>
    <linearGradient id="ep-wall-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1E3A"/>
      <stop offset="55%" stop-color="#0E2A4D"/>
      <stop offset="100%" stop-color="#153B6B"/>
    </linearGradient>
    <linearGradient id="ep-sky-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B4B85"/>
      <stop offset="100%" stop-color="#D9E8F8"/>
    </linearGradient>
    <linearGradient id="ep-board-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B2242"/>
      <stop offset="100%" stop-color="#11325E"/>
    </linearGradient>
    <linearGradient id="ep-desk-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE9F8"/>
    </linearGradient>
    <clipPath id="ep-window-clip">
      <rect x="44" y="42" width="268" height="218" rx="14"/>
    </clipPath>
  </defs>

  <!-- Fond mural de la salle de classe (bleu profond Educa-Psy) -->
  <rect x="0" y="0" width="800" height="450" rx="12" fill="url(#ep-wall-grad)"/>

  <!-- Liseré décoratif discret -->
  <rect x="14" y="14" width="772" height="422" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- Fenêtre donnant sur la ville de province -->
  <g clip-path="url(#ep-window-clip)">
    <rect x="44" y="42" width="268" height="218" fill="url(#ep-sky-grad)"/>

    <!-- Soleil / halo lumineux blanc -->
    <circle cx="258" cy="84" r="24" fill="#FFFFFF" fill-opacity="0.92"/>
    <circle cx="258" cy="84" r="36" fill="#FFFFFF" fill-opacity="0.22"/>

    <!-- Nuages légers -->
    <path d="M74 90 Q86 76 104 84 Q118 74 132 86 Q142 86 144 96 L70 96 Z" fill="#FFFFFF" fill-opacity="0.72"/>
    <path d="M168 72 Q178 62 192 68 Q202 62 212 72 Z" fill="#FFFFFF" fill-opacity="0.55"/>

    <!-- Collines de province en arrière-plan -->
    <path d="M40 198 Q112 142 186 178 T316 168 L316 264 L40 264 Z" fill="#2A61A3"/>
    <path d="M40 218 Q134 182 218 206 T316 196 L316 264 L40 264 Z" fill="#173E6E"/>

    <!-- Silhouettes de maisons et clocher/école d'une ville de province -->
    <!-- Maison 1 -->
    <rect x="66" y="198" width="42" height="34" fill="#FFFFFF"/>
    <polygon points="61,198 87,178 113,198" fill="#0E2A4D"/>
    <rect x="75" y="210" width="9" height="12" rx="1" fill="#1E4F8C"/>
    <rect x="92" y="210" width="9" height="10" rx="1" fill="#1E4F8C"/>

    <!-- Bâtiment central (école / mairie de province) -->
    <rect x="122" y="182" width="70" height="50" fill="#F2F7FD"/>
    <polygon points="116,182 157,154 198,182" fill="#0A1E3A"/>
    <rect x="148" y="146" width="18" height="14" fill="#F2F7FD"/>
    <polygon points="145,146 157,134 169,146" fill="#0A1E3A"/>
    <circle cx="157" cy="153" r="3" fill="#1E4F8C"/>
    <rect x="132" y="195" width="11" height="14" rx="1.5" fill="#1E4F8C"/>
    <rect x="151" y="203" width="12" height="29" rx="1.5" fill="#0E2A4D"/>
    <rect x="171" y="195" width="11" height="14" rx="1.5" fill="#1E4F8C"/>

    <!-- Maison 3 -->
    <rect x="206" y="200" width="38" height="32" fill="#FFFFFF"/>
    <polygon points="201,200 225,183 249,200" fill="#143B6B"/>
    <rect x="214" y="211" width="9" height="11" rx="1" fill="#1E4F8C"/>
    <rect x="228" y="211" width="8" height="21" rx="1" fill="#0E2A4D"/>

    <!-- Arbres / palmiers stylisés -->
    <g stroke="#0E2A4D" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M276 232 Q278 205 282 184"/>
      <path d="M282 184 Q266 177 258 186"/>
      <path d="M282 184 Q298 176 306 186"/>
      <path d="M282 184 Q270 168 282 164"/>
      <path d="M282 184 Q295 169 301 174"/>
    </g>

    <!-- Sol / avenue de la ville -->
    <rect x="44" y="232" width="268" height="30" fill="#0E2A4D"/>
    <line x1="56" y1="246" x2="300" y2="246" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="10 10"/>
  </g>

  <!-- Cadre et croisillons blancs de la fenêtre -->
  <rect x="44" y="42" width="268" height="218" rx="14" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  <line x1="178" y1="42" x2="178" y2="260" stroke="#FFFFFF" stroke-width="3.5"/>
  <line x1="44" y1="152" x2="312" y2="152" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="38" y="256" width="280" height="10" rx="4" fill="#DCE9F8"/>

  <!-- Tableau de classe à droite -->
  <g transform="translate(348, 42)">
    <rect x="0" y="0" width="408" height="216" rx="10" fill="url(#ep-board-grad)" stroke="#FFFFFF" stroke-width="5"/>
    <rect x="10" y="10" width="388" height="196" rx="6" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>

    <!-- En-tête à la craie blanche -->
    <text x="204" y="46" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" letter-spacing="1.5">ÉDUCATION POUR TOUS</text>
    <line x1="88" y1="58" x2="320" y2="58" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5"/>

    <!-- Livre ouvert dessiné à la craie sur le tableau -->
    <g transform="translate(42, 82)" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 10 Q28 0 56 12 L56 74 Q28 62 0 72 Z" fill="#FFFFFF" fill-opacity="0.1"/>
      <path d="M112 10 Q84 0 56 12 L56 74 Q84 62 112 72 Z" fill="#FFFFFF" fill-opacity="0.1"/>
      <line x1="14" y1="26" x2="42" y2="24"/>
      <line x1="14" y1="38" x2="42" y2="36"/>
      <line x1="14" y1="50" x2="36" y2="48"/>
      <line x1="70" y1="24" x2="98" y2="26"/>
      <line x1="70" y1="36" x2="98" y2="38"/>
      <line x1="70" y1="48" x2="92" y2="50"/>
    </g>

    <!-- Lignes de cours & schémas sur le tableau -->
    <g stroke="#DCE9F8" stroke-linecap="round">
      <line x1="184" y1="96" x2="364" y2="96" stroke-width="3" stroke-opacity="0.85"/>
      <line x1="184" y1="116" x2="338" y2="116" stroke-width="2.5" stroke-opacity="0.6"/>
      <line x1="184" y1="136" x2="352" y2="136" stroke-width="2.5" stroke-opacity="0.6"/>
      <line x1="184" y1="156" x2="296" y2="156" stroke-width="2.5" stroke-opacity="0.6"/>
    </g>

    <!-- Petit schéma géométrique -->
    <g transform="translate(324, 146)" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.8">
      <polygon points="0,36 22,0 44,36"/>
      <circle cx="22" cy="24" r="7"/>
    </g>

    <!-- Rebords craies du tableau -->
    <rect x="-4" y="212" width="416" height="10" rx="4" fill="#DCE9F8"/>
    <rect x="46" y="208" width="28" height="5" rx="2" fill="#FFFFFF"/>
    <rect x="82" y="208" width="22" height="5" rx="2" fill="#9CC0E8"/>
  </g>

  <!-- Plancher / zone basse de la classe -->
  <rect x="0" y="346" width="800" height="104" fill="#081830"/>
  <line x1="16" y1="346" x2="784" y2="346" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- ÉLÈVE 1 (à gauche, lit un livre et lève la main) -->
  <g transform="translate(132, 240)">
    <!-- Bras levé -->
    <path d="M56 66 Q76 34 74 10" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="74" cy="6" r="7" fill="#FFFFFF"/>
    <!-- Tête & cheveux -->
    <circle cx="28" cy="22" r="21" fill="#FFFFFF"/>
    <path d="M8 20 Q12 -4 34 -2 Q50 2 48 22 Q40 10 26 12 Q14 14 8 20 Z" fill="#184780"/>
    <!-- Buste (uniforme bleu Educa-Psy avec col blanc) -->
    <path d="M-2 108 L4 56 Q8 44 28 44 Q48 44 52 56 L58 108 Z" fill="#1F5698" stroke="#FFFFFF" stroke-width="2.5"/>
    <polygon points="18,45 28,58 38,45" fill="#FFFFFF"/>
  </g>

  <!-- ÉLÈVE 2 (au centre, concentrée sur ses cahiers) -->
  <g transform="translate(358, 232)">
    <!-- Tête & nattes stylisées -->
    <circle cx="38" cy="24" r="22" fill="#FFFFFF"/>
    <circle cx="15" cy="14" r="8" fill="#184780"/>
    <circle cx="61" cy="14" r="8" fill="#184780"/>
    <path d="M16 20 Q22 -2 38 -2 Q54 -2 60 20 Q48 10 38 11 Q26 10 16 20 Z" fill="#184780"/>
    <!-- Buste -->
    <path d="M6 116 L12 60 Q16 46 38 46 Q60 46 64 60 L70 116 Z" fill="#2A69B4" stroke="#FFFFFF" stroke-width="2.5"/>
    <polygon points="27,47 38,61 49,47" fill="#FFFFFF"/>
  </g>

  <!-- ÉLÈVE 3 (à droite, échange avec camarade / livre en main) -->
  <g transform="translate(596, 238)">
    <!-- Tête -->
    <circle cx="30" cy="22" r="21" fill="#FFFFFF"/>
    <path d="M9 19 Q14 -3 32 -2 Q49 0 51 20 Q38 10 28 10 Q16 12 9 19 Z" fill="#143B6B"/>
    <!-- Buste -->
    <path d="M0 110 L6 58 Q10 44 30 44 Q50 44 54 58 L60 110 Z" fill="#1B4B85" stroke="#FFFFFF" stroke-width="2.5"/>
    <polygon points="20,45 30,58 40,45" fill="#FFFFFF"/>
  </g>

  <!-- Pupitres / tables scolaires blanches au premier plan -->
  <!-- Bureau 1 -->
  <g transform="translate(64, 332)">
    <rect x="0" y="0" width="190" height="16" rx="5" fill="url(#ep-desk-grad)"/>
    <rect x="18" y="16" width="10" height="72" rx="3" fill="#B3CEE9"/>
    <rect x="162" y="16" width="10" height="72" rx="3" fill="#B3CEE9"/>
    <!-- Livre ouvert sur bureau 1 -->
    <g transform="translate(48, -14)">
      <path d="M0 8 Q24 0 46 8 L46 22 Q24 14 0 22 Z" fill="#FFFFFF" stroke="#0E2A4D" stroke-width="2"/>
      <path d="M92 8 Q68 0 46 8 L46 22 Q68 14 92 22 Z" fill="#EEF5FC" stroke="#0E2A4D" stroke-width="2"/>
    </g>
    <!-- Pile de livres -->
    <rect x="12" y="-12" width="32" height="12" rx="2" fill="#1E4F8C" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="15" y="-22" width="28" height="10" rx="2" fill="#FFFFFF" stroke="#0E2A4D" stroke-width="1.5"/>
  </g>

  <!-- Bureau 2 (central) -->
  <g transform="translate(298, 326)">
    <rect x="0" y="0" width="204" height="18" rx="5" fill="url(#ep-desk-grad)"/>
    <rect x="20" y="18" width="11" height="78" rx="3" fill="#B3CEE9"/>
    <rect x="173" y="18" width="11" height="78" rx="3" fill="#B3CEE9"/>
    <!-- Grand livre ouvert & stylo -->
    <g transform="translate(46, -18)">
      <path d="M0 10 Q28 0 56 10 L56 26 Q28 16 0 26 Z" fill="#FFFFFF" stroke="#0E2A4D" stroke-width="2"/>
      <path d="M112 10 Q84 0 56 10 L56 26 Q84 16 112 26 Z" fill="#EEF5FC" stroke="#0E2A4D" stroke-width="2"/>
      <line x1="12" y1="13" x2="44" y2="11" stroke="#2A69B4" stroke-width="2" stroke-linecap="round"/>
      <line x1="68" y1="11" x2="100" y2="13" stroke="#2A69B4" stroke-width="2" stroke-linecap="round"/>
      <!-- Crayon -->
      <line x1="94" y1="-2" x2="112" y2="16" stroke="#0E2A4D" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <!-- Pot à crayons blanc & bleu -->
    <rect x="16" y="-22" width="18" height="22" rx="3" fill="#1F5698" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="21" y1="-22" x2="19" y2="-33" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="28" y1="-22" x2="31" y2="-34" stroke="#DCE9F8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Bureau 3 (à droite) -->
  <g transform="translate(546, 332)">
    <rect x="0" y="0" width="190" height="16" rx="5" fill="url(#ep-desk-grad)"/>
    <rect x="18" y="16" width="10" height="72" rx="3" fill="#B3CEE9"/>
    <rect x="162" y="16" width="10" height="72" rx="3" fill="#B3CEE9"/>
    <!-- Pile de 3 livres + cahier ouvert -->
    <g transform="translate(30, -14)">
      <path d="M0 8 Q22 0 44 8 L44 22 Q22 14 0 22 Z" fill="#FFFFFF" stroke="#0E2A4D" stroke-width="2"/>
      <path d="M88 8 Q66 0 44 8 L44 22 Q66 14 88 22 Z" fill="#EEF5FC" stroke="#0E2A4D" stroke-width="2"/>
    </g>
    <rect x="134" y="-11" width="38" height="11" rx="2" fill="#2A69B4" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="137" y="-21" width="34" height="10" rx="2" fill="#FFFFFF" stroke="#0E2A4D" stroke-width="1.5"/>
    <rect x="140" y="-30" width="28" height="9" rx="2" fill="#143B6B" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
</svg>
