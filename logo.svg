<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fond bleu circulaire agrandi -->
  <circle cx="250" cy="250" r="240" fill="#0000FF" />

  <!-- Symbole du livre ouvert et du profil avec la psyché -->
  <g fill="#FFFFFF">
    <!-- Page gauche du livre -->
    <path d="M 100,270 C 100,270 160,245 230,270 L 230,210 C 160,185 100,210 100,210 Z" />
    <path d="M 90,258 C 90,258 150,233 220,258 L 220,198 C 150,173 90,198 90,198 Z" opacity="0.8" />
    <path d="M 80,246 C 80,246 140,221 210,246 L 210,186 C 140,161 80,186 80,186 Z" opacity="0.6" />

    <!-- Page droite du livre -->
    <path d="M 400,270 C 400,270 340,245 270,270 L 270,210 C 340,185 400,210 400,210 Z" />
    <path d="M 410,258 C 410,258 350,233 280,258 L 280,198 C 350,173 410,198 410,198 Z" opacity="0.8" />
    <path d="M 420,246 C 420,246 360,221 290,246 L 290,186 C 360,161 420,186 420,186 Z" opacity="0.6" />

    <!-- Profil de tête et cercle central agrandis -->
    <circle cx="250" cy="225" r="38" fill="#0000FF" />
    <circle cx="250" cy="225" r="36" fill="none" stroke="#FFFFFF" stroke-width="3.5" />
    
    <!-- Symbole Psyché (Ψ) -->
    <text x="250" y="236" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Ψ</text>

    <!-- Texte Educa-Psy agrandi -->
    <text x="250" y="345" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#FFFFFF">Educa-Psy</text>
  </g>
</svg>
