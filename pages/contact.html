<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nous Contacter — Educa-Psy</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <main class="page-content">
    <div class="container">
      <div style="max-width:1000px;margin:0 auto;">
        <h1 class="page-title fade-in">Nous Contacter</h1>
        <p class="page-intro fade-in delay-1">Vous avez une question ? Contactez-nous. Notre équipe sera ravie de vous aider.</p>
        <div class="contact-layout" style="margin-top:3rem;">
          <div class="contact-info fade-in">
            <div class="contact-info-item">
              <div class="contact-info-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg></div>
              <div class="contact-info-text"><h3>Adresse</h3><p>Port-au-Prince, Haïti</p></div>
            </div>
            <div class="contact-info-item">
              <div class="contact-info-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></div>
              <div class="contact-info-text"><h3>Téléphone</h3><p>+509 XXXX XXXX</p></div>
            </div>
            <div class="contact-info-item">
              <div class="contact-info-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg></div>
              <div class="contact-info-text"><h3>Email</h3><p>contact@educa-psy.org</p></div>
            </div>
          </div>
          <div class="contact-form-wrap fade-in delay-1">
            <form id="contact-form">
              <div class="form-row">
                <div class="form-group"><label for="firstName">Prénom</label><input type="text" id="firstName" name="firstName" required /></div>
                <div class="form-group"><label for="lastName">Nom</label><input type="text" id="lastName" name="lastName" required /></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label for="email">Email</label><input type="email" id="email" name="email" required /></div>
                <div class="form-group"><label for="phone">Téléphone</label><input type="tel" id="phone" name="phone" /></div>
              </div>
              <div class="form-group"><label for="subject">Sujet</label><input type="text" id="subject" name="subject" required /></div>
              <div class="form-group"><label for="message">Message</label><textarea id="message" name="message" rows="6" required></textarea></div>
              <button type="submit" class="btn-submit">Envoyer</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../js/main.js"></script>
</body>
</html>
